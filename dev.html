<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Ring Toss Tank · dev host</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%275%27 fill=%27none%27 stroke=%27%23ff4b4b%27 stroke-width=%273%27/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1a33; color: #cfe8ff; overflow: hidden;
        font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #host { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; }
      #screen-wrap { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
      #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
      #controls { flex: 0 0 auto; display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 0 18px; }
      .pump { width: 112px; height: 112px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #a9e6ff, #4aa8d8 60%, #2a6f9a);
        box-shadow: 0 6px 0 #1d4f70, 0 8px 18px #0008; touch-action: none; color: #0b2b44; font: bold 13px ui-monospace, monospace; }
      .pump.down { transform: translateY(5px); box-shadow: 0 1px 0 #1d4f70, 0 3px 8px #0008; }
      .pump.b { display: none; }
      body.two-nozzles .pump.b { display: block; }
      .small { display: flex; flex-direction: column; gap: 8px; }
      .small button { background: #1a3355; color: #cfe8ff; border: 1px solid #36598a; border-radius: 14px; padding: 7px 10px; font: 11px ui-monospace, monospace; touch-action: manipulation; }
      #tune { position: fixed; top: 0; right: 0; max-height: 100%; overflow: auto; width: min(320px, 92vw); background: #0b1a33ee;
        border-left: 1px solid #36598a; padding: 8px 10px 40px; box-sizing: border-box; display: none; touch-action: pan-y; -webkit-user-select: text; user-select: text; }
      #tune.open { display: block; }
      #tune h3 { margin: 10px 0 4px; font-size: 12px; color: #ffd36b; }
      #tune label { display: grid; grid-template-columns: 1fr 52px; gap: 0 6px; font-size: 11px; margin: 4px 0; }
      #tune input[type=range] { grid-column: 1 / 3; width: 100%; }
      #tune .val { text-align: right; color: #9fd0ff; }
      #tune .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
      #tune .row button { background: #1a3355; color: #cfe8ff; border: 1px solid #36598a; border-radius: 6px; padding: 4px 8px; font: 11px ui-monospace, monospace; }
      #gate { position: fixed; inset: 0; background: #050b1aee; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 5; text-align: center; padding: 24px; }
      #gate.hidden { display: none; }
      #gate button { font: bold 16px ui-monospace, monospace; padding: 16px 28px; border-radius: 30px; border: 0; background: #ffd23a; color: #3a2400; box-shadow: 0 5px 0 #c48a12; }
      #gate p { margin: 0; max-width: 300px; color: #9fd0ff; font-size: 12px; }
      #tilt-note { font-size: 10px; color: #6a879e; min-height: 12px; }
      #tune textarea { width: 100%; height: 80px; font-size: 10px; background: #061226; color: #9fd0ff; border: 1px solid #36598a; }
    </style>
  </head>
  <body>
    <div id="host">
      <div id="screen-wrap"><canvas id="screen" width="320" height="288"></canvas></div>
      <div id="controls">
        <div class="small">
          <button id="btn-select">SELECT</button>
          <button id="btn-debug">DEBUG</button>
        </div>
        <button class="pump a" id="btn-pump-a">PUMP</button>
        <button class="pump b" id="btn-pump-b">PUMP B</button>
        <div class="small">
          <button id="btn-start">START</button>
          <button id="btn-recenter">RECENTER</button>
          <button id="btn-tune">TUNE</button>
        </div>
      </div>
    </div>
    <div id="tilt-note-wrap" style="position:fixed;left:0;right:0;bottom:2px;text-align:center"><span id="tilt-note"></span></div>
    <div id="gate">
      <button id="btn-gate">TAP TO START</button>
      <p>Hold the phone upright. Tilt to steer the rings as they sink, shake to jostle them, and hit RECENTER if you hold your phone at an angle.</p>
    </div>
    <div id="tune"></div>
    <script type="module" src="/src/dev-host.ts"></script>
  </body>
</html>
